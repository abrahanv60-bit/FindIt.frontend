<nav class="flex flex-wrap items-center justify-between gap-4 bg-blue-700 p-4 text-white">
  <a routerLink="/" class="text-xl font-bold"> Encuéntralo </a>

  <div class="flex flex-wrap items-center gap-6">
    <a routerLink="/" class="hover:underline"> Inicio </a>

    @if (auth.usuarioActual(); as usuario) {
      <a routerLink="/publicar" class="rounded-lg bg-green-500 px-4 py-2 hover:bg-green-600">
        + Publicar objeto
      </a>

      <span> Bienvenido, {{ usuario.nombre }} </span>

      <button (click)="cerrarSesion()" class="rounded-lg bg-red-500 px-4 py-2 hover:bg-red-600">
        Cerrar sesión
      </button>
    } @else {
      <a routerLink="/login" class="hover:underline"> Iniciar sesión </a>

      <a routerLink="/registro" class="hover:underline"> Registrarse </a>
    }
  </div>
</nav>

<router-outlet />
